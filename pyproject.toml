[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "downsweep"
version = "0.1.0"
description = "Sort a messy Downloads folder into neat folders with one command."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Hari Prasath S" }]
keywords = ["downloads", "organizer", "cleaner", "files", "cli"]

[project.scripts]
downsweep = "downsweep.cli:main"

[tool.setuptools]
packages = ["downsweep"]